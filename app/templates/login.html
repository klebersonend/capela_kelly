{% extends "base.html" %}

{% block title %}Acesso Restrito | Kelly Santana Capelania{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5 col-xl-4">
                <div class="card auth-card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                    <div class="auth-header text-center p-4">
                        <div class="auth-icon-circle mx-auto mb-3">
                            <i class="bi bi-shield-lock-fill text-primary fs-3"></i>
                        </div>
                        <h2 class="h4 fw-bold text-dark mb-1">Área Restrita</h2>
                        <p class="text-muted small mb-0">Autenticação segura do portal de Capelania</p>
                    </div>

                    <div class="card-body p-4 pt-2">
                        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                            <!-- Proteção CSRF Token -->
                            <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">

                            <div class="mb-3">
                                <label for="username" class="form-label text-dark fw-semibold small">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Digite seu usuário" required autofocus autocomplete="username">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label text-dark fw-semibold small">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar com Segurança
                            </button>

                            <div class="text-center">
                                <a href="{{ url_for('public.index') }}" class="text-decoration-none text-muted small">
                                    <i class="bi bi-arrow-left me-1"></i> Voltar à página pública
                                </a>
                            </div>
                        </form>
                    </div>

                    <div class="auth-footer bg-light p-3 text-center border-top">
                        <small class="text-muted d-flex align-items-center justify-content-center gap-1">
                            <i class="bi bi-shield-check text-success"></i> Criptografia e proteção de acesso ativa
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
